<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Multiview</title>
<!-- CDN corregido de Hls.js -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 2px;
    width: 100%;
    height: 100%;
  }
  .box { position: relative; background: #000; overflow: hidden; min-height: 0; min-width: 0; }
  .media { width: 100%; height: 100%; border: 0; background: #000; display: block; }
  video.media { object-fit: contain; }

  /* Botón maximizar (toca la pantalla para mostrarlo) */
  .max {
    position: absolute; top: 6px; right: 6px; z-index: 10;
    background: rgba(0,0,0,.55); color: #fff;
    border: 1px solid rgba(255,255,255,.35); border-radius: 4px;
    padding: 6px 10px; font-size: 12px; opacity: 0;
    transition: opacity .2s;
  }
  .box:hover .max, .box.tap .max { opacity: 1; }

  /* Modo pantalla completa interno (funciona en WebView sin API fullscreen) */
  .box.full { position: fixed; inset: 0; z-index: 100; }
</style>
</head>
<body>

<div class="grid" id="grid"></div>

<script>
/* ============================================================
   CONFIGURA AQUÍ TUS 4 STREAMS
   - type "hls"    → URL .m3u8 (se reproduce con <video>)
   - type "iframe" → URL de embed (se muestra en <iframe>)
   - Deja url vacío ("") para dejar el cuadro en negro
   ============================================================ */
const STREAMS = [
  { type: "iframe",    url: "https://la18hd.su/vivo/canales.php?stream=max1" },
  { type: "iframe",    url: "https://la18hd.su/vivo/canales.php?stream=tntsportschile" },
  { type: "iframe", url: "https://la18hd.su/vivo/canales.php?stream=premiere5" },
  { type: "iframe", url: "https://la18hd.su/vivo/canales.php?stream=premiere2" }
];

/* Opcional: también puedes pasarlos por URL, ej:
   index.html?s1=https://...m3u8&s2=https://...&s3=...&s4=...
   (si detecta ".m3u8" usa HLS, si no usa iframe) */
const params = new URLSearchParams(location.search);
for (let i = 0; i < 4; i++) {
  const p = params.get("s" + (i + 1));
  if (p) STREAMS[i] = { type: p.includes(".m3u8") ? "hls" : "iframe", url: p };
}

const grid = document.getElementById("grid");
const hlsInstances = [];

STREAMS.forEach((s, i) => {
  const box = document.createElement("div");
  box.className = "box";

  if (s.url) {
    if (s.type === "hls") {
      const video = document.createElement("video");
      video.className = "media";
      video.controls = true;
      video.muted = true;          // necesario para autoplay en WebView
      video.autoplay = true;
      video.playsInline = true;
      video.setAttribute("playsinline", "");
      box.appendChild(video);

      if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = s.url;
      } else if (window.Hls && Hls.isSupported()) {
        const hls = new Hls({ lowLatencyMode: true });
        hls.loadSource(s.url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
        hls.on(Hls.Events.ERROR, (_, d) => {
          if (d.fatal) {
            if (d.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
            else if (d.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
          }
        });
        hlsInstances[i] = hls;
      }
    } else {
      const f = document.createElement("iframe");
      f.className = "media";
      f.src = s.url;
      f.allow = "autoplay; fullscreen; encrypted-media; picture-in-picture";
      f.allowFullscreen = true;
      box.appendChild(f);
    }
  }

  const btn = document.createElement("button");
  btn.className = "max";
  btn.textContent = "Maximizar";
  btn.onclick = () => {
    const full = box.classList.toggle("full");
    btn.textContent = full ? "Cerrar" : "Maximizar";
  };
  box.appendChild(btn);

  // Mostrar el botón al tocar (en móvil no hay hover)
  box.addEventListener("touchstart", () => {
    box.classList.add("tap");
    clearTimeout(box._t);
    box._t = setTimeout(() => box.classList.remove("tap"), 2500);
  }, { passive: true });

  grid.appendChild(box);
});
</script>
</body>
</html>
