<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Multiview</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }

  /* Exactamente 2 pantallas lado a lado. Con ?layout=v, una arriba y otra abajo. */
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr;
    gap: 4px;
    width: 100%;
    height: 100%;
  }
  .grid.v { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }

  .box {
    position: relative; background: #000; overflow: hidden;
    min-height: 0; min-width: 0; outline: none;
    border: 3px solid transparent;
  }
  /* Celda activa (la que tiene el "foco" del control remoto) */
  .box.active { border-color: #f5c518; }

  .media { width: 100%; height: 100%; border: 0; background: #000; display: block; }
  video.media { object-fit: contain; }

  /* Botón SIEMPRE visible: en TV no existe hover ni touch. */
  .max {
    position: absolute; top: 8px; right: 8px; z-index: 10;
    background: rgba(0,0,0,.6); color: #fff;
    border: 1px solid rgba(255,255,255,.4); border-radius: 4px;
    padding: 8px 14px; font-size: 14px; opacity: .55;
    transition: opacity .2s; cursor: pointer;
  }
  .box.active .max { opacity: 1; }

  /* Pantalla completa interna (funciona en WebView sin API fullscreen) */
  .box.full { position: fixed; inset: 0; z-index: 100; border-color: transparent; }

  .hint {
    position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%);
    z-index: 200; background: rgba(0,0,0,.75); color: #fff;
    font: 13px sans-serif; padding: 6px 14px; border-radius: 4px;
    transition: opacity .4s; pointer-events: none;
  }
  .hint.off { opacity: 0; }
</style>
</head>
<body>

<div class="grid" id="grid"></div>
<div class="hint" id="hint">◀ ▶ cambiar pantalla · OK maximizar / restaurar · Atrás restaurar</div>

<script>
/* ============================================================
   CONFIGURA AQUÍ TUS 2 STREAMS (máximo 2, el resto se ignora)
   - type "hls"    → URL .m3u8 (se reproduce con <video>)
   - type "iframe" → URL de embed (se muestra en <iframe>)
   - Deja url vacío ("") para dejar el cuadro en negro

   Por URL:  index.html?s1=https://...&s2=https://...&layout=v
   (si la URL contiene ".m3u8" usa HLS, si no usa iframe)
   ============================================================ */
const MAX_SCREENS = 2;

const STREAMS = [
  { type: "iframe", url: "https://la18hd.su/vivo/canales.php?stream=espnmx" },
  { type: "iframe", url: "https://la18hd.su/vivo/canales.php?stream=tudn" }
].slice(0, MAX_SCREENS);

const params = new URLSearchParams(location.search);
for (let i = 0; i < MAX_SCREENS; i++) {
  const p = params.get("s" + (i + 1));
  if (p) STREAMS[i] = { type: p.includes(".m3u8") ? "hls" : "iframe", url: p };
}

const grid = document.getElementById("grid");
const vertical = params.get("layout") === "v";
if (vertical) grid.classList.add("v");

const boxes = [];          // .box de cada pantalla
const medias = [];         // <video> o <iframe>
const hlsInstances = [];
let active = 0;            // pantalla con el foco
let maximized = -1;        // índice maximizado, o -1

STREAMS.forEach((s, i) => {
  const box = document.createElement("div");
  box.className = "box";
  box.tabIndex = 0;

  let media = null;
  if (s.url) {
    if (s.type === "hls") {
      media = document.createElement("video");
      media.className = "media";
      media.muted = true;           // el audio lo decide setActive()
      media.autoplay = true;
      media.playsInline = true;
      media.setAttribute("playsinline", "");
      box.appendChild(media);

      if (media.canPlayType("application/vnd.apple.mpegurl")) {
        media.src = s.url;
      } else if (window.Hls && Hls.isSupported()) {
        const hls = new Hls({ lowLatencyMode: true });
        hls.loadSource(s.url);
        hls.attachMedia(media);
        hls.on(Hls.Events.MANIFEST_PARSED, () => media.play().catch(() => {}));
        hls.on(Hls.Events.ERROR, (_, d) => {
          if (d.fatal) {
            if (d.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
            else if (d.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
          }
        });
        hlsInstances[i] = hls;
      }
    } else {
      media = document.createElement("iframe");
      media.className = "media";
      media.allow = "autoplay; fullscreen; encrypted-media; picture-in-picture";
      media.allowFullscreen = true;
      box.appendChild(media);
      // Carga escalonada: la 2.ª arranca 1.5 s después para no pedir
      // los dos decoders exactamente al mismo tiempo.
      setTimeout(() => { if (maximized < 0 || maximized === i) media.src = s.url; }, i * 1500);
    }
  }
  medias[i] = media;

  const btn = document.createElement("button");
  btn.className = "max";
  btn.textContent = "Maximizar";
  btn.onclick = (e) => { e.stopPropagation(); setActive(i); toggleMax(i); };
  box.appendChild(btn);

  // Click/tap sobre la pantalla = darle el foco (y el audio, si es HLS).
  box.addEventListener("click", () => setActive(i));

  boxes[i] = box;
  grid.appendChild(box);
});

/* Foco + audio: solo la pantalla activa suena (solo aplica a <video> HLS;
   el audio de un iframe de otro dominio no se puede controlar desde aquí). */
function setActive(i) {
  active = i;
  boxes.forEach((b, k) => b.classList.toggle("active", k === i));
  medias.forEach((m, k) => { if (m && m.tagName === "VIDEO") m.muted = (k !== i); });
  if (maximized < 0) boxes[i].focus({ preventScroll: true });
}

/* Maximizar: la otra pantalla se DESCARGA (iframe -> about:blank, HLS -> stop)
   para liberar su decoder; al restaurar se vuelve a cargar. */
function toggleMax(i) {
  const other = 1 - i;
  if (maximized === i) {
    maximized = -1;
    boxes[i].classList.remove("full");
    boxes[i].querySelector(".max").textContent = "Maximizar";
    loadScreen(other);
  } else {
    maximized = i;
    boxes[i].classList.add("full");
    boxes[i].querySelector(".max").textContent = "Cerrar";
    unloadScreen(other);
  }
}

function unloadScreen(i) {
  const m = medias[i];
  if (!m) return;
  if (m.tagName === "IFRAME") m.src = "about:blank";
  else if (hlsInstances[i]) hlsInstances[i].stopLoad();
  if (m.tagName === "VIDEO") m.pause();
}

function loadScreen(i) {
  const m = medias[i], s = STREAMS[i];
  if (!m || !s || !s.url) return;
  if (m.tagName === "IFRAME") m.src = s.url;
  else {
    if (hlsInstances[i]) hlsInstances[i].startLoad();
    m.play().catch(() => {});
  }
}

/* Control remoto / teclado.
   OJO: si el foco está DENTRO de un iframe, las teclas las recibe el iframe
   y no esta página; en ese caso usa el botón "Maximizar" con el cursor. */
function showHint() {
  const h = document.getElementById("hint");
  h.classList.remove("off");
  clearTimeout(showHint._t);
  showHint._t = setTimeout(() => h.classList.add("off"), 5000);
}

document.addEventListener("keydown", (e) => {
  showHint();
  const prev = vertical ? "ArrowUp" : "ArrowLeft";
  const next = vertical ? "ArrowDown" : "ArrowRight";
  if (maximized < 0) {
    if (e.key === prev) { setActive(0); e.preventDefault(); }
    else if (e.key === next) { setActive(1); e.preventDefault(); }
  }
  if (e.key === "Enter" || e.key === " ") { toggleMax(active); e.preventDefault(); }
  else if ((e.key === "Escape" || e.key === "Backspace" || e.key === "BrowserBack" || e.keyCode === 4)
           && maximized >= 0) { toggleMax(maximized); e.preventDefault(); }
});

setActive(0);
showHint();
</script>
</body>
</html>
